<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web Development Lab</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 18px;
        }

        .questions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #333;
        }

        .card p {
            color: #666;
        }

        .card a {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 25px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }

        .card a:hover {
            background: #764ba2;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>💻 Web Development Lab</h1>
        <p>HTML, CSS & JavaScript Practical Programs</p>
    </div>

    <div class="questions">
        <div class="card">
            <h2>Question 1</h2>
            <p>HTML Program</p>

        </div>

        <div class="card">

        </div>

        <div class="card">

            <p>HTML / CSS Program</p>
            <a href="index2.html">Open Question 2</a>
        </div>

        <div class="card">
            <h2>Question 3</h2>
            <p>CSS Program</p>
            <a href="index3.html">Open Question 3</a>
        </div>

        <div class="card">
            <h2>Question 4</h2>
            <p>JavaScript Program</p>
            <a href="index4.html">Open Question 4</a>
        </div>

    </div>

</div>

</body>
</html>
